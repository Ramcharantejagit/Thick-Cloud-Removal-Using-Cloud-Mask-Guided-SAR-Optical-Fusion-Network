{% extends "base.html" %}{% block title %}Register{% endblock %}
{% block content %}
<div class="container py-4"><div class="row justify-content-center"><div class="col-md-6 col-lg-5">
  <div class="card shadow-sm"><div class="card-body p-4">
    <h3 class="mb-1">Create account</h3>
    <p class="text-muted small">New accounts must be approved by the administrator before use.</p>
    <form method="post" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3"><label class="form-label" for="name">Full name</label><input class="form-control" id="name" name="name" value="{{ name or '' }}" required minlength="2" maxlength="80"></div>
      <div class="mb-3"><label class="form-label" for="email">Email</label><input class="form-control" id="email" type="email" name="email" value="{{ email or '' }}" required maxlength="120"></div>
      <div class="mb-3"><label class="form-label" for="password">Password</label><input class="form-control" id="password" type="password" name="password" required minlength="8" autocomplete="new-password"><div class="form-text">At least 8 characters, with letters and digits.</div></div>
      <div class="mb-3"><label class="form-label" for="confirm">Confirm password</label><input class="form-control" id="confirm" type="password" name="confirm" required autocomplete="new-password"></div>
      <button class="btn btn-primary w-100">Register</button>
    </form>
    <div class="small mt-3 text-center">Already registered? <a href="{{ url_for('login') }}">Log in</a></div>
  </div></div>
</div></div></div>
{% endblock %}
