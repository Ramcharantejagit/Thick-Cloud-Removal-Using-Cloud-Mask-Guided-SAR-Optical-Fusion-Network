{% extends "base.html" %}{% block title %}User Login{% endblock %}
{% block content %}
<div class="container py-4"><div class="row justify-content-center"><div class="col-md-6 col-lg-4">
  <div class="card shadow-sm"><div class="card-body p-4">
    <h3 class="mb-3"><i class="bi bi-person me-2"></i>User login</h3>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3"><label class="form-label" for="email">Email</label><input class="form-control" id="email" type="email" name="email" value="{{ email or '' }}" required autocomplete="username"></div>
      <div class="mb-3"><label class="form-label" for="password">Password</label><input class="form-control" id="password" type="password" name="password" required autocomplete="current-password"></div>
      <button class="btn btn-primary w-100">Log in</button>
    </form>
    <div class="small mt-3 text-center">No account? <a href="{{ url_for('register') }}">Register</a></div>
  </div></div>
</div></div></div>
{% endblock %}
