{% extends "base.html" %}{% block title %}Activity{% endblock %}
{% block content %}
<div class="container py-3">
  <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3"><h2 class="mb-0">User activity</h2>
    <form method="get" class="d-flex flex-wrap gap-2">
      <select class="form-select form-select-sm w-auto" name="user" aria-label="User"><option value="">All users</option>{% for u in users %}<option value="{{ u.id }}" {% if user_id==u.id %}selected{% endif %}>{{ u.name }}</option>{% endfor %}</select>
      <select class="form-select form-select-sm w-auto" name="action" aria-label="Action"><option value="">All actions</option>{% for a in actions %}<option {% if action==a %}selected{% endif %}>{{ a }}</option>{% endfor %}</select>
      <button class="btn btn-sm btn-primary">Filter</button></form></div>
  <div class="card shadow-sm"><div class="table-responsive"><table class="table table-sm align-middle mb-0">
    <thead class="table-light"><tr><th>Date (UTC)</th><th>Actor</th><th>Action</th><th>Detail</th><th>IP</th></tr></thead>
    <tbody>{% for a in acts %}<tr><td class="text-nowrap small">{{ a.created_at }}</td><td>{{ a.actor }}</td><td><span class="badge {% if 'fail' in a.action or 'blocked' in a.action %}bg-danger{% else %}bg-secondary{% endif %}">{{ a.action }}</span></td><td class="small text-break">{{ a.detail }}</td><td class="small">{{ a.ip or '' }}</td></tr>
    {% else %}<tr><td colspan="5" class="text-muted">No activity.</td></tr>{% endfor %}</tbody></table></div></div>
</div>
{% endblock %}
