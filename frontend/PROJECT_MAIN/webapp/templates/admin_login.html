{% extends "base.html" %}{% block title %}Admin Login{% endblock %}
{% block content %}
<div class="container py-4"><div class="row justify-content-center"><div class="col-md-6 col-lg-4">
  <div class="card shadow-sm border-dark"><div class="card-body p-4">
    <h3 class="mb-3"><i class="bi bi-shield-lock me-2"></i>Admin login</h3>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3"><label class="form-label" for="username">Username</label><input class="form-control" id="username" name="username" value="{{ username or '' }}" required autocomplete="username"></div>
      <div class="mb-3"><label class="form-label" for="password">Password</label><input class="form-control" id="password" type="password" name="password" required autocomplete="current-password"></div>
      <button class="btn btn-dark w-100">Log in as admin</button>
    </form>
  </div></div>
</div></div></div>
{% endblock %}
